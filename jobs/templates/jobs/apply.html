{% extends 'jobs/base.html' %}

{% block content %}
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="fw-bold">Apply for {{ job.title }}</h1>
            <p class="text-muted"><i class="bi bi-building"></i> {{ job.company }} | <i class="bi bi-geo-alt"></i> {{ job.location }}</p>
            <hr>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    {{ form.applicant_name }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    {{ form.applicant_email }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Cover Letter</label>
                    {{ form.cover_letter }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Upload CV</label>
                    {{ form.cv }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Submit Application</button>
                    <a href="{% url 'job_detail' job.pk %}" class="btn btn-outline-secondary">← Back</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
